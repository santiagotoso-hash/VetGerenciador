version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vetpet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetpet
      POSTGRES_PASSWORD: vetpet123
      POSTGRES_DB: vetpet_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vetpet -d vetpet_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vetpet-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vetpet.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
